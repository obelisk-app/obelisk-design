<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d">
  <title id="t">Obelisk on social media</title>
  <desc id="d">Official Obelisk accounts: Instagram @obelisk.ar, YouTube @obelisk_ar, X @obelisk_ar.</desc>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-opacity="0.035"/></pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#b4f953" stop-opacity="0.28"/><stop offset="1" stop-color="#b4f953" stop-opacity="0"/></radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c5ff6e"/><stop offset="1" stop-color="#5a8f1f"/></linearGradient>
    <clipPath id="frame"><rect width="1200" height="420" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#frame)" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
    <rect width="1200" height="420" fill="#0a0a0a"/>
    <rect width="1200" height="420" fill="url(#grid)"/>
    <circle cx="140" cy="120" r="260" fill="url(#glow)"/>

    <!-- header: product mark + title -->
    <g transform="translate(56 50) scale(0.875)">
      <rect width="64" height="64" rx="15" fill="url(#mark)"/>
      <path d="M32 9.5 27.6 15 25.2 53.5H31.6V15Z" fill="none" stroke="#0a0a0a" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M32 9.5 36.4 15 38.8 53.5H31.6V15Z" fill="#0a0a0a" stroke="#0a0a0a" stroke-width="2.5" stroke-linejoin="round"/>
    </g>
    <text x="130" y="86" font-size="34" font-weight="800" fill="#fafafa" letter-spacing="-0.8">Obelisk</text>
    <text x="1144" y="86" font-size="20" font-weight="600" fill="#a3a3a3" text-anchor="end">Seguinos · Follow us</text>

    <!-- three account cards -->
    <g font-size="15">
      <!-- Instagram -->
      <g transform="translate(56 140)">
        <rect width="344" height="224" rx="22" fill="#171717" stroke="#262626"/>
        <rect x="28" y="28" width="56" height="56" rx="16" fill="#1f2a12" stroke="#5a8f1f"/>
        <g transform="translate(56 56)" fill="none" stroke="#b4f953" stroke-width="3">
          <rect x="-15" y="-15" width="30" height="30" rx="9"/><circle r="7"/><circle cx="9" cy="-9" r="1.6" fill="#b4f953" stroke="none"/>
        </g>
        <text x="28" y="128" font-size="22" font-weight="700" fill="#fafafa">Instagram</text>
        <text x="28" y="164" font-size="26" font-weight="800" fill="#b4f953" letter-spacing="-0.4">@obelisk.ar</text>
        <text x="28" y="196" fill="#a3a3a3">instagram.com/obelisk.ar</text>
      </g>
      <!-- YouTube -->
      <g transform="translate(428 140)">
        <rect width="344" height="224" rx="22" fill="#171717" stroke="#262626"/>
        <rect x="28" y="28" width="56" height="56" rx="16" fill="#1f2a12" stroke="#5a8f1f"/>
        <g transform="translate(56 56)">
          <rect x="-17" y="-12" width="34" height="24" rx="7" fill="none" stroke="#b4f953" stroke-width="3"/><path d="M -4 -6 L 7 0 L -4 6 Z" fill="#b4f953"/>
        </g>
        <text x="28" y="128" font-size="22" font-weight="700" fill="#fafafa">YouTube</text>
        <text x="28" y="164" font-size="26" font-weight="800" fill="#b4f953" letter-spacing="-0.4">@obelisk_ar</text>
        <text x="28" y="196" fill="#a3a3a3">youtube.com/@obelisk_ar</text>
      </g>
      <!-- X -->
      <g transform="translate(800 140)">
        <rect width="344" height="224" rx="22" fill="#171717" stroke="#262626"/>
        <rect x="28" y="28" width="56" height="56" rx="16" fill="#1f2a12" stroke="#5a8f1f"/>
        <g transform="translate(56 56)" stroke="#b4f953" stroke-width="3.4" stroke-linecap="round">
          <line x1="-12" y1="-13" x2="12" y2="13"/><line x1="12" y1="-13" x2="-12" y2="13"/>
        </g>
        <text x="28" y="128" font-size="22" font-weight="700" fill="#fafafa">X (Twitter)</text>
        <text x="28" y="164" font-size="26" font-weight="800" fill="#b4f953" letter-spacing="-0.4">@obelisk_ar</text>
        <text x="28" y="196" fill="#a3a3a3">x.com/obelisk_ar</text>
      </g>
    </g>
    <text x="56" y="398" font-size="15" fill="#737373">obelisk.ar · github.com/obelisk-app</text>
  </g>
</svg>
